name: phonecam_mobile
description: PhoneCam Mobile application for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_webrtc: ^1.4.1
  shared_models:
    path: ../../packages/shared_models
  protocol:
    path: ../../packages/protocol
  discovery:
    path: ../../packages/discovery
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  device_info_plus: ^10.1.2
  intl: ^0.19.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
